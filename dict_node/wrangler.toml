name = "eco-npc-dict"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# D1 数据库绑定。database_id 由 `wrangler d1 create eco-npc-dict` 生成后填入。
[[d1_databases]]
binding = "DB"
database_name = "eco-npc-dict"
database_id = "9ce91305-3aa6-48de-995a-1afacd2fae45"

# 写入/读取口令用 secret 设置, 不写在这里:
#   wrangler secret put TOKEN
# 单次请求上限(可不改)
[vars]
MAX_ITEMS = "500"
MAX_LEN = "4000"
